name: Verify resume generator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF dependencies
        run: python -m pip install --upgrade pip reportlab pypdf

      - name: Generate resume PDF
        run: RESUME_OUTPUT_PATH=artifacts/resume.pdf python generate_resume.py

      - name: Validate generated PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          output = Path("artifacts/resume.pdf")
          assert output.is_file(), "Resume PDF was not created"
          assert output.stat().st_size > 1_000, "Resume PDF is unexpectedly small"
          assert len(PdfReader(str(output)).pages) == 2, "Resume must contain exactly two pages"
          PY
