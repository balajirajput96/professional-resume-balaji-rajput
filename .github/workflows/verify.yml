name: Verify resume generator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF dependencies
        run: python -m pip install --upgrade pip reportlab pypdf

      - name: Generate Fresher resume PDF (Default)
        run: RESUME_OUTPUT_PATH=artifacts/resume.pdf python generate_resume.py

      - name: Generate Experienced resume PDF
        run: python generate_resume.py --profile experienced --output artifacts/experienced.pdf

      - name: Generate Tata Starbucks Assistant Store Manager resume PDF
        run: python generate_resume.py --profile starbucks --output artifacts/starbucks.pdf

      - name: Validate all generated PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          profiles = {
              "Fresher (Default)": Path("artifacts/resume.pdf"),
              "Experienced": Path("artifacts/experienced.pdf"),
              "Tata Starbucks ASM": Path("artifacts/starbucks.pdf"),
          }

          for name, output in profiles.items():
              assert output.is_file(), f"{name} resume PDF was not created"
              assert output.stat().st_size > 1_000, f"{name} resume PDF is unexpectedly small"
              page_count = len(PdfReader(str(output)).pages)
              print(f"Validated {name}: {page_count} pages, {output.stat().st_size} bytes")
              assert page_count == 2, f"{name} resume must contain exactly two pages, found {page_count}"

          print("All profiles successfully verified and strictly 2 pages!")
          PY
